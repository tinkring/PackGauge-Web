name: Check website

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked website dependencies
        run: npm ci
      - name: Check source and demo data
        run: npm run check
      - name: Build all three pages
        run: npm run build
      - name: Set up Python for browser checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser-test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test the production build in Chromium
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/packgauge-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          python -m unittest discover -s tests -p browser_test.py -v
      - name: Attach built-site preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: packgauge-site-preview
          path: dist
          retention-days: 7
